services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    env_file: .env
    environment:
      VINEXT_TRUST_PROXY: "1"
      VINEXT_TRUSTED_HOSTS: hatamestate.com,web.hatamestate.com,app.hatamestate.com,admin.hatamestate.com,consultant.hatamestate.com,agency.hatamestate.com,panel.hatamestate.com
    volumes:
      - hatam-data:/app/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  reminders:
    build:
      context: ..
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    env_file: .env
    environment:
      HATAM_INTERNAL_ORIGIN: http://app:3000
    command: ["node", "scripts/reminder-worker.mjs"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      app:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  hatam-data:
  caddy-data:
  caddy-config:
